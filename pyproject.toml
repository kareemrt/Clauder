[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalforge"
version = "0.1.0"
description = "Generate fractal images and animations from the command line"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.scripts]
fractalforge = "fractalforge.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["fractalforge*"]
