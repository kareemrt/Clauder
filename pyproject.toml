[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "foodsave"
version = "1.0.0"
description = "AI-powered food waste reduction assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["food waste", "sustainability", "AI", "climate", "Claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Other/Nonlisted Topic",
]
dependencies = [
    "anthropic>=0.40.0",
    "rich>=13.0.0",
]

[project.scripts]
foodsave = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["foodsave*"]
