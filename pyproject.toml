[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpulse"
version = "1.0.0"
description = "Terminal Git Analytics Dashboard — visualize any repository's history"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["git", "analytics", "terminal", "cli", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "rich>=13.0",
  "gitpython>=3.1",
  "click>=8.1",
]

[project.scripts]
gitpulse = "gitpulse.cli:main"

[project.urls]
Repository = "https://github.com/kareemrt/clauder"
Issues = "https://github.com/kareemrt/clauder/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitpulse*"]
