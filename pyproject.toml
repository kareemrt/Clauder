[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "orbit"
version = "1.0.0"
description = "Real-time solar system simulator for your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["rich>=13.0.0"]

[project.scripts]
orbit = "orbit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orbit*"]
