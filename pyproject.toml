[project]
name = "fracta"
version = "0.1.0"
description = "A procedural fractal and generative art engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.scripts]
fracta = "fracta.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fracta*"]
