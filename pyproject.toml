[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worldforge"
version = "0.1.0"
description = "Procedural fantasy world map generator"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.scripts]
worldforge = "worldforge.cli:main"

[tool.setuptools]
packages = ["worldforge"]
