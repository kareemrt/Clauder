[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "clauder"
version = "1.0.0"
description = "AI-powered code review in your terminal, powered by Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
]

[project.scripts]
clauder = "clauder.cli:main"

[project.urls]
Homepage = "https://github.com/kareemrt/Clauder"
Repository = "https://github.com/kareemrt/Clauder"

[tool.setuptools.packages.find]
where = ["."]
include = ["clauder*"]
