[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clauder"
version = "0.1.0"
description = "AI-powered GitHub repository storyteller, powered by Claude"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["github", "claude", "ai", "storyteller", "repository", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.50.0",
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
    "jinja2>=3.1",
]

[project.scripts]
clauder = "clauder.cli:main"

[project.urls]
Homepage = "https://github.com/kareemrt/clauder"
Repository = "https://github.com/kareemrt/clauder"

[tool.setuptools.packages.find]
where = ["."]
include = ["clauder*"]

[tool.setuptools.package-data]
clauder = ["templates/*"]
