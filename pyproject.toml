[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalis"
version = "0.1.0"
description = "A zero-dependency fractal generation toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
fractalis = "fractalis.cli:main"

[tool.setuptools]
packages = ["fractalis"]
