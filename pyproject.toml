[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clauder"
version = "0.1.0"
description = "Multi-agent AI repository intelligence powered by Claude"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "kareemrt", email = "kareemrt@gmail.com"}]
requires-python = ">=3.11"
keywords = ["ai", "claude", "code-review", "static-analysis", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "anthropic>=0.40.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
clauder = "clauder.cli:main"

[project.urls]
Homepage = "https://github.com/kareemrt/clauder"
Issues = "https://github.com/kareemrt/clauder/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["clauder*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
