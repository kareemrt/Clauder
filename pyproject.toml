[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "codepulse"
version = "1.0.0"
description = "💓 Git Repository Health Visualizer — beautiful terminal analytics for any git repo"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kareem", email = "kareemrt@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["click>=8.0"]
keywords = ["git", "analytics", "visualization", "devtools", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
codepulse = "codepulse.cli:main"

[project.urls]
Homepage = "https://github.com/kareemrt/clauder"
Repository = "https://github.com/kareemrt/clauder"

[tool.setuptools.packages.find]
where = ["."]
include = ["codepulse*"]
