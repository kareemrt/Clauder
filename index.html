<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantumDrift — Particle Life Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="ui">
      <div id="header">
        <h1>⬡ QuantumDrift</h1>
        <p class="subtitle">Emergent Particle Life</p>
      </div>

      <div id="controls">
        <div class="section-label">PRESET</div>
        <div id="presets">
          <button class="preset-btn active" data-preset="cells">Cells</button>
          <button class="preset-btn" data-preset="predator">Predator</button>
          <button class="preset-btn" data-preset="coral">Coral</button>
          <button class="preset-btn" data-preset="galaxy">Galaxy</button>
          <button class="preset-btn" data-preset="chaos">Chaos</button>
          <button class="preset-btn" data-preset="random">Random</button>
        </div>

        <div class="section-label">SIMULATION</div>
        <div class="slider-group">
          <label>Particles <span id="count-val">600</span></label>
          <input type="range" id="count" min="100" max="1500" step="50" value="600" />
        </div>
        <div class="slider-group">
          <label>Speed <span id="speed-val">1.0x</span></label>
          <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1.0" />
        </div>
        <div class="slider-group">
          <label>Force Range <span id="range-val">80</span></label>
          <input type="range" id="range" min="20" max="200" step="5" value="80" />
        </div>
        <div class="slider-group">
          <label>Friction <span id="friction-val">0.85</span></label>
          <input type="range" id="friction" min="0.5" max="0.99" step="0.01" value="0.85" />
        </div>

        <div class="section-label">RENDER</div>
        <div class="slider-group">
          <label>Glow <span id="glow-val">12</span>px</label>
          <input type="range" id="glow" min="0" max="40" step="1" value="12" />
        </div>
        <div class="slider-group">
          <label>Trail <span id="trail-val">0.18</span></label>
          <input type="range" id="trail" min="0.05" max="0.5" step="0.01" value="0.18" />
        </div>
        <div class="slider-group">
          <label>Particle Size <span id="size-val">2.5</span></label>
          <input type="range" id="size" min="1" max="6" step="0.5" value="2.5" />
        </div>

        <div id="action-btns">
          <button id="btn-reset">↺ Reset</button>
          <button id="btn-pause">⏸ Pause</button>
          <button id="btn-screenshot">⬇ Save</button>
        </div>
      </div>

      <div id="stats">
        <div class="stat"><span class="stat-label">FPS</span><span id="fps">0</span></div>
        <div class="stat"><span class="stat-label">PARTICLES</span><span id="stat-count">0</span></div>
        <div class="stat"><span class="stat-label">SPECIES</span><span id="stat-species">0</span></div>
      </div>
    </div>

    <div id="legend"></div>
    <div id="tooltip">Click to add energy burst</div>
  </div>

  <script src="src/presets.js"></script>
  <script src="src/simulation.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
